<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تطبيق إدارة المهام اليومية - نظم مهامك بسهولة واحترافية">
    <title>مُنظم المهام اليومية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">📋 مُنظم المهام</h1>
                <p class="app-subtitle">نظم يومك بذكاء وسهولة</p>
            </div>
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">إجمالي</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="activeTasks">0</span>
                    <span class="stat-label">نشطة</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">مكتملة</span>
                </div>
            </div>
        </header>

        <!-- Add Task Section -->
        <div class="add-task-section">
            <form id="taskForm" class="task-form">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="أضف مهمة جديدة..." 
                        maxlength="200"
                        required
                        autocomplete="off"
                    >
                    <button type="submit" class="add-btn" aria-label="إضافة مهمة">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">إضافة</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">
                <span class="filter-icon">📝</span>
                الكل
            </button>
            <button class="filter-btn" data-filter="active">
                <span class="filter-icon">⏳</span>
                النشطة
            </button>
            <button class="filter-btn" data-filter="completed">
                <span class="filter-icon">✅</span>
                المكتملة
            </button>
        </div>

        <!-- Tasks List Section -->
        <div class="tasks-section">
            <div id="tasksList" class="tasks-list">
                <!-- Tasks will be dynamically added here -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📭</div>
                <h3 class="empty-title">لا توجد مهام بعد</h3>
                <p class="empty-text">ابدأ بإضافة مهمتك الأولى لتنظيم يومك</p>
            </div>
        </div>

        <!-- Actions Section -->
        <div class="actions-section">
            <button id="clearCompleted" class="action-btn clear-btn">
                <span class="btn-icon">🗑️</span>
                حذف المكتملة
            </button>
            <button id="clearAll" class="action-btn danger-btn">
                <span class="btn-icon">⚠️</span>
                حذف الكل
            </button>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="footer-text">صُمم بـ <span class="heart">❤️</span> لتنظيم أفضل</p>
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">تعديل المهمة</h3>
                <button class="modal-close" id="closeModal" aria-label="إغلاق">×</button>
            </div>
            <div class="modal-body">
                <input 
                    type="text" 
                    id="editInput" 
                    class="edit-input" 
                    maxlength="200"
                    placeholder="عدّل المهمة..."
                >
            </div>
            <div class="modal-footer">
                <button id="cancelEdit" class="modal-btn cancel-btn">إلغاء</button>
                <button id="saveEdit" class="modal-btn save-btn">حفظ</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
